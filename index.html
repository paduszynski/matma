<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matma – ćwiczymy matematykę</title>
<meta name="version" content="1.10">
<meta name="description" content="Matma – aplikacja do nauki matematyki dla dzieci: liczenie do 20, tabliczka mnożenia, działania w słupku.">
<meta name="theme-color" content="#fbfcf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18203a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matma">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f3a93'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E%C3%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Zeszyt w kratkę: squared paper, red margin, blue-pen ink, highlighter for "selected", index card taped to the page. */
:root{
  --paper:#fbfcf7; --grid:#d8e5f3; --sheet:#ffffff; --ink:#1f3a93; --ink-soft:#5a6fae; --red:#d9463b;
  --hl:#fff176; --hl-ink:#1f3a93; --good:#1e8a4c; --good-soft:#d9f2df; --bad-soft:#fbe0dd; --tape:rgba(255,232,130,.8);
  --rule:#dfe9f5; --card-line:#f1c4bf; --shadow:0 10px 22px -6px rgba(31,58,147,.22);
  --m0:transparent; --m1:#f7c3be; --m2:#ffd79a; --m3:#fff176; --m4:#a8e3b4;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18203a; --grid:#253055; --sheet:#1f2847; --ink:#d3defc; --ink-soft:#95a6d6; --red:#ff7f74;
    --hl:#6c5f16; --hl-ink:#fff6b0; --good:#6ee69a; --good-soft:#1d3d33; --bad-soft:#4a2533; --tape:rgba(255,232,130,.35);
    --rule:#2b375e; --card-line:#5a3044; --shadow:0 10px 22px -6px rgba(0,0,0,.5);
    --m1:#6e2f3b; --m2:#73531e; --m3:#6c5f16; --m4:#22603f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--hand);font-size:19px;line-height:1.35;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;top:0;bottom:0;left:40px;width:2px;background:var(--red);opacity:.6;pointer-events:none;z-index:0}
@media (max-width:640px){body::before{left:14px}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 0 64px;position:relative;z-index:1}
@media (max-width:640px){.wrap{padding:0 12px 0 28px}}

/* Header + tabs */
header.top{position:relative;z-index:10;background:var(--paper);border-bottom:2px solid var(--ink)}
header .wrap{display:flex;align-items:center;gap:22px;min-height:70px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-size:2.1rem;line-height:1}
.logo{width:44px;height:44px;border:2.5px solid var(--ink);border-radius:52% 46% 55% 47%;display:grid;place-items:center;font-size:1.9rem;transform:rotate(-6deg)}
.ver{font-size:.95rem;color:var(--red);border:1.5px solid var(--red);border-radius:52% 46% 55% 47%;padding:1px 7px;transform:rotate(-6deg);align-self:flex-start}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:2px 8px;font-size:1.3rem;color:var(--ink-soft)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--hl-ink);background:linear-gradient(transparent 50%,var(--hl) 50%)}

main{padding:28px 0 48px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}.layout .settings{order:2}}

.panel{background:var(--sheet);box-shadow:var(--shadow);padding:20px 22px;position:relative}
.panel h2{margin:0 0 12px;font-size:1.5rem;font-weight:400;color:var(--red);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.settings{transform:rotate(.6deg)}
@media (max-width:900px){.settings{transform:none}}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.label{display:block;font-size:1rem;color:var(--red);margin-bottom:6px}

.seg{display:flex;flex-wrap:wrap;gap:4px 10px}
.seg button{border:0;background:transparent;padding:1px 4px;font-size:1.15rem;color:var(--ink-soft)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--hl-ink);background:linear-gradient(transparent 48%,var(--hl) 48%)}

.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{border:2px solid var(--ink);background:transparent;border-radius:52% 46% 55% 47%;aspect-ratio:1;font-size:1.25rem;display:grid;place-items:center;padding:0;transition:transform .1s}
.chip:nth-child(even){border-radius:47% 55% 46% 52%}
.chip:hover{transform:rotate(-4deg)}
.chip[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}
.chip:disabled{opacity:.3;cursor:not-allowed;transform:none}
.chip-actions{display:flex;gap:14px;margin-top:6px}
.link{border:0;background:none;color:var(--ink-soft);padding:2px 0;font-size:1rem;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px}
.link:hover{color:var(--ink)}
.hint{font-size:1rem;color:var(--ink-soft);margin:6px 0 0}
.hint.err{color:var(--red)}

/* Stage */
.stage{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:2px 4px}
.stat b{display:block;font-size:2.4rem;font-weight:400;line-height:1}
.stat span{font-size:1.05rem;color:var(--ink-soft)}
.stat.ok b{color:var(--good)} .stat.bad b{color:var(--red)}
.stat.streak b{background:linear-gradient(transparent 55%,var(--hl) 55%);width:fit-content;padding:0 4px;color:var(--hl-ink)}
@media (max-width:520px){.stats{gap:6px}.stat b{font-size:1.8rem}.stat span{font-size:.9rem}}


.play{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:center;padding-top:10px}
@media (max-width:1100px){.play{grid-template-columns:1fr}}
.play.flipmode{grid-template-columns:1fr}

.card{perspective:1400px;width:100%;max-width:640px;margin:0 auto;aspect-ratio:3/2;user-select:none;transform:rotate(-1.2deg)}
.flipmode .card{cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 20px 20px;
  background-color:var(--sheet);box-shadow:var(--shadow);
  background-image:linear-gradient(transparent 48px,var(--card-line) 48px,var(--card-line) 50px,transparent 50px),repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px)}
.face::before{content:"";position:absolute;top:-14px;left:50%;width:130px;height:30px;transform:translateX(-50%) rotate(2deg);background:var(--tape)}
.face.back{transform:rotateY(180deg)}
.card.ok .face.back{background-color:var(--good-soft)}
.card.bad .face.back{background-color:var(--bad-soft)}
.badge{position:absolute;top:14px;left:20px;font-size:1.1rem;color:var(--red)}
.badge.retry{left:auto;right:20px;color:var(--hl-ink);background:linear-gradient(transparent 45%,var(--hl) 45%);padding:0 4px}
.expr{font-size:clamp(2.8rem,9vw,5.6rem);line-height:1;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.slot{min-width:1.5em;text-align:center;border-bottom:3px solid var(--ink);color:var(--ink)}
.slot.filled{border-bottom-style:solid}
.slot .caret{display:inline-block;width:3px;height:.75em;background:var(--ink);vertical-align:-.05em;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.answer{color:var(--ink)}
.card.ok .answer{color:var(--good)} .card.bad .answer{color:var(--red)}
.feedback{font-size:1.7rem;min-height:1.4em;text-align:center}
.card.ok .feedback{color:var(--good)} .card.bad .feedback{color:var(--red)}
.sub{color:var(--ink-soft);text-align:center;font-size:1.15rem}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-1.2deg) translateX(-12px)}40%{transform:rotate(-1.2deg) translateX(10px)}60%{transform:rotate(-1.2deg) translateX(-7px)}80%{transform:rotate(-1.2deg) translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:rotate(-1.2deg) scale(1.03)}}

.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;width:100%;margin:0 auto}
.key{border:2px solid var(--ink);background:var(--sheet);border-radius:11px 15px 9px 13px;font-size:2rem;line-height:1;padding:12px 0;transition:transform .08s}
.key:nth-child(even){border-radius:14px 9px 13px 11px}
.key:active{transform:scale(.94) rotate(-2deg)}
.key.go{background:var(--hl);color:var(--hl-ink)}
.key.del{color:var(--ink-soft)}
.numpad.waiting .key:not(.go){opacity:.4}
.key.next{font-size:1.4rem}

.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);border-radius:12px 16px 10px 14px;padding:10px 20px;font-size:1.35rem;background:var(--sheet);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:hover{transform:rotate(-1deg)}
.btn.primary{background:var(--hl);color:var(--hl-ink)}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--red);color:var(--red)}
.btn.small{padding:6px 14px;font-size:1.2rem}
.kbd-hint{text-align:center;color:var(--ink-soft);font-size:1rem;margin:0}
kbd{font-family:inherit;border:1.5px solid var(--ink-soft);border-bottom-width:3px;border-radius:6px;padding:0 6px}
.hidden{display:none !important}

/* Summary */
.summary{text-align:center;padding:36px 20px;transform:rotate(-.4deg)}
.summary h2{font-size:2.4rem;color:var(--ink);text-decoration:none;margin:0 0 4px}
.stars{font-size:3.4rem;letter-spacing:.15em;margin:6px 0;color:#f2b705;font-family:system-ui,sans-serif}
.stars .off{color:var(--grid)}
.big-score{font-size:1.3rem;color:var(--ink-soft);margin-bottom:18px}
.mistakes{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:0 auto 22px;max-width:700px}
.mistakes span{color:var(--red);font-size:1.4rem;border:2px solid var(--red);border-radius:52% 46% 55% 47%;padding:2px 14px}

/* Progress grid */
.mastery{margin-top:32px}
.mastery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mastery-head h2{margin:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:1rem;color:var(--ink-soft)}
.legend i{display:inline-block;width:16px;height:16px;border:1.5px solid var(--ink-soft);vertical-align:-2px;margin-right:5px}
.grid-scroll{overflow-x:auto}
table.grid{border-collapse:collapse;margin:0 auto;min-width:560px;width:100%;max-width:1100px}
.grid th{font-weight:400;color:var(--red);font-size:1.3rem;padding:4px}
.grid td{border:1px solid var(--rule);background:var(--m0);text-align:center;font-size:1.2rem;padding:6px 2px;transition:.2s}
.grid td.l1{background:var(--m1)} .grid td.l2{background:var(--m2)} .grid td.l3{background:var(--m3)} .grid td.l4{background:var(--m4)}
.grid td.off{background:transparent;color:transparent;border-color:transparent}
.grid .corner{color:var(--ink)}
.mastery-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.overall{color:var(--ink)}

footer{color:var(--ink-soft);text-align:center;font-size:1rem;padding:0 16px 32px;position:relative;z-index:1}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}


/* ---------- menu ---------- */
header .wrap{position:relative}
.menu-btn{margin-left:auto;display:flex;align-items:center;gap:12px;border:2px solid var(--ink);background:var(--sheet);border-radius:12px 16px 10px 14px;padding:6px 12px;font-size:1.25rem;min-width:0}
.menu-title{background:linear-gradient(transparent 50%,var(--hl) 50%);color:var(--hl-ink);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:flex;flex-direction:column;gap:5px;width:24px;flex:none}
.burger i{display:block;height:3px;border-radius:3px;background:var(--ink)}
.burger i:nth-child(1){transform:rotate(-2deg)} .burger i:nth-child(3){transform:rotate(2deg);width:85%}
.menu-btn[aria-expanded="true"] .burger i:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-btn[aria-expanded="true"] .burger i:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] .burger i:nth-child(3){transform:translateY(-8px) rotate(-45deg);width:100%}
.menu{position:absolute;right:16px;top:100%;margin-top:8px;z-index:30;background:var(--sheet);box-shadow:var(--shadow);border:2px solid var(--ink);
  border-radius:6px 10px 8px 12px;padding:8px;display:flex;flex-direction:column;gap:4px;width:min(380px,calc(100vw - 32px))}
.menu[hidden]{display:none}
.menu-item{text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px 13px 9px 12px;display:flex;flex-direction:column;gap:2px}
.menu-item b{font-weight:400;font-size:1.4rem;line-height:1.1;width:fit-content;padding:0 3px}
.menu-item span{color:var(--ink-soft);font-size:1rem}
.menu-item:hover{background:var(--paper)}
.menu-item[aria-current="true"] b{background:linear-gradient(transparent 50%,var(--hl) 50%);color:var(--hl-ink)}
.grid.wide td{font-size:.95rem;padding:4px 0}
.expr.long{font-size:clamp(2rem,6vw,3.8rem)}
.feedback .explain{display:block;font-size:1.15rem;color:var(--ink-soft);margin-top:4px}
.numpad.roman .key:not(.go){font-family:Georgia,"Times New Roman",serif;letter-spacing:.02em}
.legend-line{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;color:var(--ink-soft);font-size:1.05rem}
.legend-line b{font-weight:400;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.grid.wide th{font-size:1.05rem;padding:2px}

/* ---------- W słupku ---------- */
:root{--p0:rgba(217,70,59,.10);--p1:rgba(30,138,76,.10);--p2:rgba(31,58,147,.10);--p3:rgba(255,159,67,.16);--p4:rgba(150,80,200,.12);--cw:54px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p0:rgba(255,127,116,.14);--p1:rgba(110,230,154,.12);--p2:rgba(150,180,255,.14);--p3:rgba(255,180,90,.14);--p4:rgba(200,150,255,.14)}}
.stats.three{grid-template-columns:repeat(3,1fr)}
.sl-play{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:start;padding-top:6px}
@media (max-width:1100px){.sl-play{grid-template-columns:1fr}}
.sl-work{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.sheet-scroll{max-width:100%;overflow-x:auto}
.sheet{display:grid;grid-template-columns:repeat(var(--n),var(--cw));font-size:2.5rem;line-height:1;user-select:none}
.sheet .r{display:contents}
.sheet .c{height:var(--cw);display:grid;place-items:center;position:relative}
.sheet .lab .c{height:28px;font-size:1.05rem;color:var(--ink-soft)}
.sheet .sm .c{height:28px;font-size:1.3rem;color:var(--red);align-items:end}
.sheet .ln .c{height:10px}
.sheet .ln .c.on::before{content:"";position:absolute;left:-1px;right:-1px;top:4px;border-top:3px solid var(--ink)}
.sheet .c.p0{background:var(--p0)} .sheet .c.p1{background:var(--p1)} .sheet .c.p2{background:var(--p2)} .sheet .c.p3{background:var(--p3)} .sheet .c.p4{background:var(--p4)}
.sheet .c.now{box-shadow:inset 0 0 0 2px var(--hl)}
.sheet .sign{color:var(--ink)}
.sheet .box{width:calc(var(--cw) - 8px);height:calc(var(--cw) - 6px);border:2px solid var(--ink-soft);border-radius:8px 11px 7px 10px;display:grid;place-items:center;background:var(--sheet)}
.sheet .box.act{border-color:var(--ink);background:var(--hl)}
.sheet .box.act::after{content:"";width:3px;height:.8em;background:var(--hl-ink);animation:blink 1s steps(1) infinite}
.sheet .box.ok{border-color:var(--good);color:var(--good)}
.sheet .box.bad{border-color:var(--red);background:var(--bad-soft);animation:wiggle .4s}
@keyframes wiggle{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.sheet .x{position:relative;color:var(--ink-soft)}
.sheet .x::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;border-top:3px solid var(--red);transform:rotate(-28deg)}
.sheet .tap{cursor:pointer;border-radius:50%;outline:3px dashed var(--red);outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.sl-note{max-width:520px;width:100%;border:2px dashed var(--ink-soft);border-radius:12px 9px 14px 10px;padding:10px 14px;font-size:1.3rem;text-align:center;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.sl-note b{font-weight:400;color:var(--red);display:inline}
.sl-note > span{display:block}
.sl-note.good{border-color:var(--good);color:var(--good);border-style:solid}
.sl-note.bad{border-color:var(--red)}
.key.word{font-size:1.25rem}
.key:disabled{opacity:.35;cursor:default}

/* Phones: header, stats, card and keypad must fit one screen without scrolling */
@media (max-width:640px){
  header .wrap{min-height:0;gap:2px 10px;flex-wrap:wrap;padding-top:6px;padding-bottom:4px}
  .brand{font-size:1.5rem;gap:6px;flex:none}
  .logo{width:32px;height:32px;font-size:1.3rem;border-width:2px}
  .ver{font-size:.75rem;padding:0 5px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;width:100%;gap:12px}

  header .wrap{flex-wrap:nowrap}
  .menu-btn{font-size:1.05rem;padding:5px 10px;gap:10px}
  .menu{right:12px}
  .sl-play{gap:12px}
  .sl-work{gap:10px}
  :root{--cw:44px}
  .sheet{font-size:2.1rem}
  .sheet .lab .c,.sheet .sm .c{height:22px;font-size:1rem}
  .sl-note{font-size:1.1rem;padding:6px 10px;min-height:2.6em}
  .key.word{font-size:1.05rem}

  .tab{font-size:1.05rem;white-space:nowrap}
  main{padding-top:10px}
  .stage{gap:10px}
  .stats{gap:4px}
  .stat{padding:0}
  .stat b{font-size:1.6rem}
  .stat span{font-size:.85rem}
  .play{gap:14px;padding-top:6px}
  .card{aspect-ratio:auto;height:clamp(150px,28svh,230px)}
  .face{padding:34px 14px 12px;gap:4px;background-image:linear-gradient(transparent 30px,var(--card-line) 30px,var(--card-line) 32px,transparent 32px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px)}
  .face::before{top:-10px;width:90px;height:20px}
  .badge{top:6px;left:14px;font-size:.95rem}
  .badge.retry{right:14px}
  .expr{font-size:clamp(2.4rem,13vw,3.6rem)}
  .feedback{font-size:1.3rem}
  .numpad{gap:8px}
  .key{padding:0;height:clamp(46px,7.5svh,60px);font-size:1.7rem}
  .key.next{font-size:1.25rem}
  .expr.long{font-size:clamp(1.5rem,8vw,2.4rem)}
  .feedback .explain{font-size:1rem}
  .legend-line{font-size:.95rem;gap:2px 10px}
  .actions:empty{display:none}
}
@media (hover:none){.kbd-hint{display:none}}
@media (max-width:359px){.menu-title{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="logo">×</span>Matma<span class="ver" title="Wersja 1.10">1.10</span></div>

<script>
// ---------- shared: confetti, menu, PWA ----------
(() => {
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  function confetti(n) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    const colors = ['#1f3a93', '#d9463b', '#fff176', '#1e8a4c', '#ffb74d', '#4fc3f7'];
    for (let i = 0; i < n; i++) parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
      s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: colors[i % colors.length], life: 0,
    });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    const d = devicePixelRatio;
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 300);
    for (const p of parts) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.s * d / 2, -p.s * d / 4, p.s * d, p.s * d / 2);
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), 0);
  }
  window.matmaConfetti = confetti;

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();

// ---------- flashcards module, used by "Liczę do 20" and "Mnożenie i dzielenie" ----------
function Flashcards(cfg) {
  const root = document.getElementById('tab-' + cfg.id);
  const PRAISE = ['Brawo!', 'Super!', 'Świetnie!', 'Tak jest!', 'Doskonale!', 'Ekstra!', 'Mistrzowsko!', 'Dobrze!'];
  const segHtml = (id, attr, items) => `<div class="seg" data-id="${id}">${items.map(([v, l]) => `<button type="button" data-${attr}="${v}">${l}</button>`).join('')}</div>`;

  root.innerHTML = `
    <div class="layout">
      <aside class="panel settings" aria-label="Ustawienia">
        <h2>Ustawienia</h2>
        <div class="field">
          <span class="label">${cfg.opLabel || 'Działanie'}</span>
          ${segHtml('op-seg', 'op', cfg.ops)}
        </div>
        <div class="field">
          <span class="label" data-id="nums-label"></span>
          ${cfg.filter === 'chips' ? `
            <div class="chips" data-id="chips"></div>
            <div class="chip-actions">
              <button class="link" type="button" data-id="all-nums">Zaznacz wszystkie</button>
              <button class="link" type="button" data-id="no-nums">Wyczyść</button>
            </div>` : segHtml('range-seg', 'max', cfg.ranges)}
          <p class="hint" data-id="nums-hint"></p>
        </div>
        <div class="field">
          <span class="label">Jak odpowiadam?</span>
          ${segHtml('mode-seg', 'mode', [['type', 'Wpisuję wynik'], ['flip', 'Odwracam kartę']])}
        </div>
        <div class="field">
          <span class="label">Ile fiszek w rundzie?</span>
          ${segHtml('size-seg', 'size', [['10', '10'], ['20', '20'], ['30', '30'], ['all', 'Wszystkie']])}
        </div>
        <div class="field">
          <button class="btn primary small" type="button" data-id="new-round">Nowa runda ↻</button>
        </div>
      </aside>

      <div class="stage">
        <div class="stats">
          <div class="stat ok"><b data-id="s-ok">0</b><span>Dobrze</span></div>
          <div class="stat bad"><b data-id="s-bad">0</b><span>Do poprawy</span></div>
          <div class="stat streak"><b data-id="s-streak">0</b><span>Seria</span></div>
          <div class="stat"><b data-id="s-left">0</b><span>Zostało</span></div>
        </div>

        <div data-id="play" class="play">
          <div style="display:flex;flex-direction:column;gap:16px">
            <div class="card" data-id="card" aria-live="polite">
              <div class="card-inner">
                <div class="face front">
                  <span class="badge" data-id="badge-front"></span>
                  <span class="badge retry hidden" data-id="retry-front">Jeszcze raz</span>
                  <div class="expr" data-id="front-expr"></div>
                  <div class="sub" data-id="front-sub"></div>
                </div>
                <div class="face back">
                  <span class="badge" data-id="badge-back"></span>
                  <div class="expr" data-id="back-expr"></div>
                  <div class="feedback" data-id="feedback"></div>
                </div>
              </div>
            </div>
            <div class="actions" data-id="actions"></div>
            ${cfg.legend ? `<div class="legend-line">${cfg.legend}</div>` : ''}
            <p class="kbd-hint" data-id="kbd-hint"></p>
          </div>
          <div class="numpad" data-id="numpad" aria-label="Klawiatura liczbowa"></div>
        </div>

        <div data-id="summary" class="panel summary hidden"></div>
      </div>
    </div>

    <section class="panel mastery" aria-label="Postęp">
      <div class="mastery-head">
        <h2>${cfg.gridTitle}</h2>
        ${segHtml('grid-seg', 'grid', cfg.gridOps)}
      </div>
      <div class="grid-scroll"><table class="grid" data-id="grid"></table></div>
      <div class="mastery-foot">
        <div class="legend">
          <span><i></i>Jeszcze nie ćwiczone</span>
          <span><i style="background:var(--m1)"></i>Do poprawy</span>
          <span><i style="background:var(--m2)"></i>Uczę się</span>
          <span><i style="background:var(--m3)"></i>Prawie umiem</span>
          <span><i style="background:var(--m4)"></i>Umiem!</span>
        </div>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <span class="overall" data-id="overall"></span>
          <button class="link" type="button" data-id="reset">Wyzeruj postęp</button>
        </div>
      </div>
    </section>`;

  const $ = id => root.querySelector(`[data-id="${id}"]`);
  const confetti = n => window.matmaConfetti && window.matmaConfetti(n);

  // ---------- storage ----------
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(cfg.ls)); } catch (e) {}
    return { settings: { ...cfg.defaults, ...(s && s.settings) }, facts: (s && s.facts) || {} };
  }
  const store = load();
  const save = () => { try { localStorage.setItem(cfg.ls, JSON.stringify(store)); } catch (e) {} };
  const S = store.settings;

  const { key, left: leftOf, answer: answerOf, opName } = cfg;
  const eligible = () => cfg.eligible(S);
  // level: 0 = never seen, 1..4 = box (1 = needs work, 4 = mastered)
  const level = f => { const r = store.facts[key(f)]; return r ? r.box + 1 : 0; };
  const weight = f => [3, 6, 4, 2, 1][level(f)];
  const swapped = f => ({ ...f, swap: cfg.canSwap(f) && Math.random() < 0.5 });

  function sample(list, size) {
    const pool = list.map(f => ({ f, w: weight(f) }));
    const m = size === 'all' ? pool.length : Math.min(+size, pool.length);
    const out = [];
    while (out.length < m) {
      let r = Math.random() * pool.reduce((a, p) => a + p.w, 0), i = 0;
      for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
      out.push(pool.splice(i, 1)[0].f);
    }
    return out.map(swapped);
  }

  function record(f, ok) {
    const k = key(f);
    const r = store.facts[k] || { box: 0, ok: 0, bad: 0 };
    if (ok) { r.ok++; r.box = store.facts[k] ? Math.min(3, r.box + 1) : 1; }
    else { r.bad++; r.box = 0; }
    store.facts[k] = r;
    save();
  }

  // ---------- round ----------
  let R = null;
  let phase = 'question'; // question | ok | bad | revealed | summary
  let typed = '';
  let nextTimer = null;
  // after a wrong typed answer 'Dalej' stays locked for a moment, so the right answer gets read
  const BAD_LOCK = 3000;
  let lockUntil = 0, lockTimer = null;
  const locked = () => Date.now() < lockUntil;
  const tryNext = () => { if (phase === 'bad' && !locked()) next(); };

  function newRound(facts) {
    clearTimeout(nextTimer);
    const list = facts || sample(eligible(), S.size);
    R = { queue: list.map(f => ({ ...f, retry: false })), total: list.length, ok: 0, bad: 0, streak: 0, best: 0, done: 0, mistakes: new Map() };
    $('summary').classList.add('hidden');
    $('play').classList.remove('hidden');
    showCard();
  }

  const current = () => R && R.queue[0];

  function showCard() {
    const f = current();
    phase = 'question'; typed = '';
    $('card').classList.remove('flipped', 'ok', 'bad');
    if (!f) { renderEmpty(); return; }
    $('badge-front').textContent = $('badge-back').textContent = opName(f);
    $('retry-front').classList.toggle('hidden', !f.retry);
    $('feedback').textContent = '';
    buildPad(padKind(f));
    renderFront();
    renderControls();
    renderStats();
  }

  function renderEmpty() {
    $('front-expr').textContent = '?';
    $('front-sub').textContent = 'Wybierz co najmniej jedną liczbę w ustawieniach.';
    $('actions').innerHTML = '';
    $('numpad').classList.add('hidden');
    $('kbd-hint').textContent = '';
    renderStats();
  }

  const isLong = f => String(leftOf(f)).length + String(answerOf(f)).length > 10;
  function renderFront() {
    const f = current();
    $('front-expr').classList.toggle('long', isLong(f));
    if (S.mode === 'type') {
      $('front-expr').innerHTML = `<span>${leftOf(f)} =</span><span class="slot ${typed ? 'filled' : ''}">${typed || ''}<span class="caret"></span></span>`;
      $('front-sub').textContent = cfg.hint ? cfg.hint(f) : '';
    } else {
      $('front-expr').innerHTML = `<span>${leftOf(f)} =</span><span class="slot">?</span>`;
      $('front-sub').textContent = (cfg.hint && cfg.hint(f)) || 'Policz w głowie i odwróć kartę';
    }
  }

  function renderBack(given) {
    const f = current();
    $('back-expr').classList.toggle('long', isLong(f));
    $('back-expr').innerHTML = `<span>${leftOf(f)} =</span><span class="answer">${answerOf(f)}</span>`;
    const fb = $('feedback');
    if (phase === 'ok') fb.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)] + (R.streak >= 3 ? ` Seria: ${R.streak}!` : '');
    else if (phase === 'bad') fb.innerHTML = (given !== undefined ? `Prawie! Wpisałeś/aś ${given}.` : 'Nic nie szkodzi, następnym razem się uda!') + explainHtml(f);
    else fb.textContent = '';
  }

  const explainHtml = f => { const e = cfg.explain && cfg.explain(f); return e ? `<span class="explain">${e}</span>` : ''; };

  function btn(label, cls, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; return b;
  }

  function renderControls() {
    const a = $('actions'); a.innerHTML = '';
    const typeMode = S.mode === 'type';
    $('play').classList.toggle('flipmode', !typeMode);
    $('numpad').classList.toggle('hidden', !typeMode);
    $('numpad').classList.toggle('waiting', typeMode && phase !== 'question');
    const go = $('go-key');
    const wait = phase === 'bad' ? Math.ceil((lockUntil - Date.now()) / 1000) : 0;
    go.textContent = phase === 'bad' ? (wait > 0 ? `Dalej (${wait})` : 'Dalej →') : '✓';
    go.disabled = wait > 0;
    go.classList.toggle('next', phase === 'bad');
    go.setAttribute('aria-label', phase === 'bad' ? 'Dalej' : 'Sprawdź');
    const hint = $('kbd-hint');
    if (typeMode) {
      if (phase === 'question') hint.innerHTML = 'Możesz pisać na klawiaturze, <kbd>Enter</kbd> sprawdza.';
      if (phase === 'bad') hint.innerHTML = wait > 0 ? 'Zobacz dobrą odpowiedź…' : '<kbd>Enter</kbd> – dalej';
      if (phase === 'ok') hint.innerHTML = '&nbsp;';
    } else {
      if (phase === 'question') { a.append(btn('Pokaż odpowiedź', 'primary', reveal)); hint.innerHTML = 'Kliknij kartę albo naciśnij <kbd>Spacja</kbd>'; }
      if (phase === 'revealed') {
        a.append(btn('Jeszcze nie umiem', 'bad', () => judge(false)), btn('Umiem!', 'ok', () => judge(true)));
        hint.innerHTML = '<kbd>←</kbd> jeszcze nie · <kbd>→</kbd> umiem';
      }
    }
  }

  function renderStats() {
    $('s-ok').textContent = R ? R.ok : 0;
    $('s-bad').textContent = R ? R.bad : 0;
    $('s-streak').textContent = R ? R.streak : 0;
    $('s-left').textContent = R ? R.queue.length : 0;
  }

  const flip = () => $('card').classList.add('flipped');

  function check() {
    if (phase !== 'question' || S.mode !== 'type' || !typed) return;
    const f = current();
    const val = typed;
    const ok = val === String(answerOf(f));
    score(f, ok);
    phase = ok ? 'ok' : 'bad';
    const card = $('card');
    card.classList.add(ok ? 'ok' : 'bad');
    renderBack(ok ? undefined : val);
    if (!ok) {
      card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 500);
      lockUntil = Date.now() + BAD_LOCK;
      clearInterval(lockTimer);
      lockTimer = setInterval(() => { if (phase !== 'bad' || !locked()) clearInterval(lockTimer); if (phase === 'bad') renderControls(); }, 250);
    }
    flip();
    renderControls();
    renderStats();
    if (ok) nextTimer = setTimeout(next, 1100);
  }

  function reveal() {
    if (phase !== 'question' || S.mode !== 'flip') return;
    phase = 'revealed';
    renderBack();
    flip();
    renderControls();
  }

  function judge(ok) {
    if (phase !== 'revealed') return;
    const f = current();
    score(f, ok);
    phase = ok ? 'ok' : 'bad';
    $('card').classList.add(ok ? 'ok' : 'bad');
    $('feedback').innerHTML = ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'Wróci za chwilę, poćwiczymy!' + explainHtml(f);
    $('actions').innerHTML = '';
    renderStats();
    nextTimer = setTimeout(next, ok ? 700 : 1000);
  }

  function score(f, ok) {
    if (!f.retry) {
      record(f, ok);
      if (ok) R.ok++; else R.bad++;
    }
    if (ok) { R.streak++; R.best = Math.max(R.best, R.streak); }
    else { R.streak = 0; R.mistakes.set(key(f), f); }
    if (ok && R.streak > 0 && R.streak % 10 === 0) confetti(60);
  }

  function next() {
    clearTimeout(nextTimer); clearInterval(lockTimer); lockUntil = 0;
    const f = R.queue.shift();
    R.done++;
    if (phase === 'bad') {
      // the card comes back a few cards later
      R.queue.splice(Math.min(3, R.queue.length), 0, { ...swapped(f), retry: true });
    }
    if (!R.queue.length) return showSummary();
    const card = $('card');
    card.classList.remove('flipped');
    showCard();
    card.classList.add('pop'); setTimeout(() => card.classList.remove('pop'), 350);
  }

  function showSummary() {
    phase = 'summary';
    renderStats();
    const first = R.ok + R.bad;
    const pct = first ? Math.round(100 * R.ok / first) : 0;
    const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
    const title = pct === 100 ? 'Perfekcyjnie!' : pct >= 90 ? 'Brawo! Świetna robota!' : pct >= 70 ? 'Bardzo dobrze!' : pct >= 40 ? 'Nieźle, ćwiczymy dalej!' : 'Każdy błąd to nauka, spróbuj jeszcze raz!';
    const mistakes = [...R.mistakes.values()];
    const el = $('summary');
    el.innerHTML = `
      <h2>${title}</h2>
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
      <div class="big-score">${R.ok} z ${first} dobrze za pierwszym razem (${pct}%) · najdłuższa seria: ${R.best}</div>
      ${mistakes.length ? `<p class="sub" style="margin-bottom:10px">Te warto jeszcze poćwiczyć:</p>
        <div class="mistakes">${mistakes.map(f => `<span>${leftOf({ ...f, swap: false })} = ${answerOf(f)}</span>`).join('')}</div>` : ''}
      <div class="actions"></div>`;
    const a = el.querySelector('.actions');
    if (mistakes.length) a.append(btn('Ćwicz błędy', 'bad', () => newRound(mistakes.map(f => ({ ...f, swap: false })))));
    a.append(btn('Nowa runda ↻', 'primary', () => newRound()));
    $('play').classList.add('hidden');
    el.classList.remove('hidden');
    renderGrid();
    if (stars >= 2) confetti(stars === 3 ? 180 : 90);
  }

  // ---------- input ----------
  const padKind = f => cfg.padKind ? cfg.padKind(f) : 'num';
  const PADS = {
    num: ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'],
    roman: ['I', 'V', 'X', 'L', 'C', 'D', 'M', 'del', 'ok'],
  };
  let pad = null;
  function press(d) {
    if (phase !== 'question' || S.mode !== 'type') return;
    const roman = pad === 'roman';
    if (d === 'del') typed = typed.slice(0, -1);
    else if (typed.length < (roman ? 12 : cfg.maxDigits || 3)) typed = (!roman && typed === '0' ? '' : typed) + d;
    renderFront();
  }

  function buildPad(kind) {
    if (kind === pad) return;
    pad = kind;
    const np = $('numpad');
    np.innerHTML = '';
    np.classList.toggle('roman', kind === 'roman');
    PADS[kind].forEach(k => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'key' + (k === 'ok' ? ' go' : k === 'del' ? ' del' : '');
      b.textContent = k === 'del' ? '⌫' : k === 'ok' ? '✓' : k;
      b.setAttribute('aria-label', k === 'del' ? 'Usuń' : k === 'ok' ? 'Sprawdź' : k);
      if (k === 'ok') b.dataset.id = 'go-key';
      b.onclick = () => k !== 'ok' ? press(k) : phase === 'bad' ? tryNext() : check();
      np.append(b);
    });
  }
  buildPad('num');

  document.addEventListener('keydown', e => {
    if (root.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (phase === 'summary') { if (e.key === 'Enter') newRound(); return; }
    if (S.mode === 'type') {
      if (pad === 'num' && /^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
      else if (pad === 'roman' && /^[ivxlcdm]$/i.test(e.key)) { press(e.key.toUpperCase()); e.preventDefault(); }
      else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (phase === 'question') check(); else if (phase === 'bad') tryNext(); }
    } else {
      if ((e.key === ' ' || e.key === 'Enter') && phase === 'question') { e.preventDefault(); reveal(); }
      else if (e.key === 'ArrowRight') judge(true);
      else if (e.key === 'ArrowLeft') judge(false);
    }
  });
  $('card').addEventListener('click', () => { if (S.mode === 'flip') reveal(); });

  // ---------- settings ----------
  function syncSeg(id, attr, value) {
    const seg = $(id);
    if (seg) seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(value))));
  }

  function plural(n, one, few, many) {
    if (n === 1) return one;
    const d = n % 10, t = n % 100;
    return d >= 2 && d <= 4 && (t < 12 || t > 14) ? few : many;
  }

  function renderSettings() {
    syncSeg('op-seg', 'op', S.op);
    syncSeg('mode-seg', 'mode', S.mode);
    syncSeg('size-seg', 'size', S.size);
    syncSeg('grid-seg', 'grid', S.grid);
    syncSeg('range-seg', 'max', S.max);
    if (cfg.filter === 'chips') {
      const chips = $('chips'); chips.innerHTML = '';
      for (const n of cfg.nums) {
        const c = document.createElement('button');
        c.type = 'button'; c.className = 'chip'; c.textContent = n;
        c.setAttribute('aria-pressed', String(S.nums.includes(n)));
        c.disabled = cfg.chipDisabled(S, n);
        c.onclick = () => {
          S.nums = S.nums.includes(n) ? S.nums.filter(x => x !== n) : [...S.nums, n].sort((a, b) => a - b);
          changed();
        };
        chips.append(c);
      }
    }
    $('nums-label').textContent = cfg.numsLabel(S);
    const count = eligible().length;
    const hint = $('nums-hint');
    hint.classList.toggle('err', count === 0);
    hint.textContent = count === 0 ? 'Zaznacz co najmniej jedną liczbę.' : `Do wyboru jest ${count} ${plural(count, 'fiszka', 'fiszki', 'fiszek')}.`;
  }

  function changed() { save(); renderSettings(); newRound(); }
  const onSeg = (id, fn) => { const seg = $(id); if (seg) seg.querySelectorAll('button').forEach(b => b.onclick = () => fn(b.dataset)); };

  onSeg('op-seg', d => { S.op = d.op; changed(); });
  onSeg('mode-seg', d => { S.mode = d.mode; changed(); });
  onSeg('size-seg', d => { S.size = d.size; changed(); });
  onSeg('range-seg', d => { S.max = +d.max; changed(); });
  onSeg('grid-seg', d => { S.grid = d.grid; save(); syncSeg('grid-seg', 'grid', S.grid); renderGrid(); });
  if (cfg.filter === 'chips') {
    $('all-nums').onclick = () => { S.nums = cfg.nums.slice(); changed(); };
    $('no-nums').onclick = () => { S.nums = []; changed(); };
  }
  $('new-round').onclick = () => newRound();
  $('reset').onclick = () => {
    if (confirm('Na pewno wyzerować cały postęp w tym module?')) { store.facts = {}; save(); renderGrid(); }
  };

  // ---------- progress grid ----------
  function renderGrid() {
    const g = cfg.grid(S.grid);
    let html = `<tr><th class="corner">${g.corner}</th>${g.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
    let mastered = 0, total = 0;
    for (const r of g.rows) {
      html += `<tr><th>${r}</th>`;
      for (const c of g.cols) {
        const cell = g.cell(r, c);
        if (!cell) { html += '<td class="off"></td>'; continue; }
        const lv = level(cell.f);
        total++; if (lv === 4) mastered++;
        html += `<td class="l${lv}" title="${cell.title}">${cell.text}</td>`;
      }
      html += '</tr>';
    }
    const t = $('grid');
    t.innerHTML = html;
    t.classList.toggle('wide', g.cols.length > 11);
    $('overall').textContent = `Opanowane: ${mastered} z ${total} (${total ? Math.round(100 * mastered / total) : 0}%)`;
  }

  renderSettings();
  renderGrid();
  newRound();
}

// ---------- the two flashcard modules ----------
(() => {
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

  Flashcards({
    id: 'fiszki', ls: 'matma.fiszki.v1',
    defaults: { op: 'mix', nums: range(1, 10), mode: 'type', size: '20', grid: 'mul' },
    ops: [['mul', 'Mnożenie'], ['div', 'Dzielenie'], ['mix', 'Wszystko']],
    filter: 'chips', nums: range(1, 10),
    numsLabel: S => S.op === 'mul' ? 'Mnożę przez…' : S.op === 'div' ? 'Dzielę przez…' : 'Mnożę i dzielę przez…',
    chipDisabled: () => false,
    // fact {op, n, k}: mul n × k = n·k, div (n·k) : n = k
    eligible(S) {
      const out = [];
      for (const op of S.op === 'mix' ? ['mul', 'div'] : [S.op]) for (const n of S.nums) {
        if (n === 0) continue; // no zero facts (old saved settings may still hold 0)
        for (let k = 1; k <= 10; k++) out.push({ op, n, k });
      }
      return out;
    },
    key: f => (f.op === 'mul' ? 'm:' : 'd:') + f.n + ':' + f.k,
    answer: f => f.op === 'mul' ? f.n * f.k : f.k,
    left: f => f.op === 'mul' ? (f.swap ? `${f.k} × ${f.n}` : `${f.n} × ${f.k}`) : `${f.n * f.k} : ${f.n}`,
    opName: f => f.op === 'mul' ? 'Mnożenie' : 'Dzielenie',
    canSwap: f => f.op === 'mul',
    gridTitle: 'Mój postęp – tabliczka',
    gridOps: [['mul', 'Mnożenie'], ['div', 'Dzielenie']],
    grid: op => ({
      corner: op === 'mul' ? '×' : ':', rows: range(1, 10), cols: range(1, 10),
      cell: (r, c) => op === 'mul'
        ? { f: { op, n: r, k: c }, text: r * c, title: `${r} × ${c} = ${r * c}` }
        : { f: { op, n: r, k: c }, text: `${r * c}:${r}`, title: `${r * c} : ${r} = ${c}` },
    }),
  });


  // ---------- Liczby rzymskie ----------
  const RN = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  const toRoman = n => { let out = ''; for (const [v, r] of RN) while (n >= v) { out += r; n -= v; } return out; };
  // 447 -> [[400,'CD'],[40,'XL'],[7,'VII']]
  const parts = n => [1000, 100, 10, 1].map(u => Math.floor(n / u) % (u === 1000 ? 10 : 10) * u).filter(Boolean).map(v => [v, toRoman(v)]);
  const toArab = f => f.dir === 'r2a' && !f.swap;          // card shows the roman numeral
  Flashcards({
    id: 'rzymskie', ls: 'matma.rzymskie.v1',
    defaults: { op: 'mix', max: 1000, mode: 'type', size: '20', grid: '100' },
    opLabel: 'Kierunek',
    ops: [['r2a', 'Rzymskie → zwykłe'], ['a2r', 'Zwykłe → rzymskie'], ['mix', 'Na zmianę']],
    filter: 'range', ranges: [['20', 'Do 20'], ['100', 'Do 100'], ['1000', 'Do 1000 (M)']],
    numsLabel: () => 'Liczby do…',
    maxDigits: 4,
    legend: RN.filter(([, r]) => r.length === 1).reverse().map(([v, r]) => `<span><b>${r}</b> = ${v}</span>`).join(''),
    // fact {op:'rom', n, dir}; with "Na zmianę" the direction is picked per card through swap
    eligible(S) {
      const out = [];
      for (let n = 1; n <= S.max; n++) out.push({ op: 'rom', n, dir: S.op === 'a2r' ? 'a2r' : 'r2a', mix: S.op === 'mix' });
      return out;
    },
    key: f => 'r:' + f.n,
    answer: f => toArab(f) ? f.n : toRoman(f.n),
    left: f => toArab(f) ? toRoman(f.n) : f.n,
    opName: f => toArab(f) ? 'Rzymskie → zwykłe' : 'Zwykłe → rzymskie',
    canSwap: f => !!f.mix,
    padKind: f => toArab(f) ? 'num' : 'roman',
    explain: f => {
      const p = parts(f.n);
      return p.length > 1
        ? `${toRoman(f.n)} = ${p.map(x => x[1]).join(' + ')} = ${p.map(x => x[0]).join(' + ')}`
        : `${toRoman(f.n)} = ${f.n}`;
    },
    gridTitle: 'Mój postęp',
    gridOps: [['100', '1–100'], ['1000', '100–1000, co 10']],
    grid: g => g === '100'
      ? { corner: '', rows: range(0, 9).map(r => r * 10), cols: range(1, 10),
          cell: (r, c) => ({ f: { n: r + c }, text: r + c, title: `${r + c} = ${toRoman(r + c)}` }) }
      : { corner: '', rows: range(1, 10).map(r => r * 100), cols: range(0, 9).map(c => c * 10),
          cell: (r, c) => r + c > 1000 ? null : { f: { n: r + c }, text: r + c, title: `${r + c} = ${toRoman(r + c)}` } },
  });

  const SYM = { add: '+', sub: '−', mul: '×' };
  const NAME = { add: 'Dodawanie', sub: 'Odejmowanie', mul: 'Mnożenie' };
  // adding across ten, split the second number to fill up to 10: 8 + 9 -> 8 + 2 + 7
  const viaTen = f => {
    if (f.op !== 'add') return null;
    const [a, b] = f.swap ? [f.y, f.x] : [f.x, f.y];
    return a < 10 && b < 10 && a + b > 10 ? [a, 10 - a, a + b - 10] : null;
  };
  Flashcards({
    id: 'do20', ls: 'matma.do20.v1',
    defaults: { op: 'add', max: 20, mode: 'type', size: '20', grid: 'add' },
    ops: [['add', 'Dodawanie'], ['sub', 'Odejmowanie'], ['mul', 'Mnożenie'], ['mix', 'Wszystko']],
    filter: 'range', ranges: [['10', 'Do 10'], ['20', 'Do 20']],
    numsLabel: () => 'Wyniki i liczby do…',
    // fact {op, x, y}: x + y, x − y, x × y
    eligible(S) {
      const out = [], M = S.max;
      for (const op of S.op === 'mix' ? ['add', 'sub', 'mul'] : [S.op]) {
        if (op === 'add') for (let x = 1; x <= M; x++) for (let y = 1; x + y <= M; y++) out.push({ op, x, y });
        if (op === 'sub') for (let x = 1; x <= M; x++) for (let y = 1; y <= x; y++) out.push({ op, x, y });
        if (op === 'mul') for (let x = 1; x <= 10; x++) for (let y = 1; y <= 10; y++) if (x * y <= M) out.push({ op, x, y });
      }
      return out;
    },
    key: f => f.op[0] + ':' + f.x + ':' + f.y,
    answer: f => f.op === 'add' ? f.x + f.y : f.op === 'sub' ? f.x - f.y : f.x * f.y,
    left: f => f.swap ? `${f.y} ${SYM[f.op]} ${f.x}` : `${f.x} ${SYM[f.op]} ${f.y}`,
    opName: f => NAME[f.op],
    canSwap: f => f.op !== 'sub',
    hint: f => { const t = viaTen(f); return t ? `Podpowiedź: ${t[0]} + ${t[1]} + ${t[2]}` : ''; },
    explain: f => { const t = viaTen(f); return t ? `${t[0]} + ${t[1]} + ${t[2]} = 10 + ${t[2]} = ${10 + t[2]}` : ''; },
    gridTitle: 'Mój postęp',
    gridOps: [['add', 'Dodawanie'], ['sub', 'Odejmowanie'], ['mul', 'Mnożenie']],
    grid: op => op === 'mul'
      ? { corner: '×', rows: range(1, 10), cols: range(1, 10),
          cell: (r, c) => r * c > 20 ? null : { f: { op, x: r, y: c }, text: r * c, title: `${r} × ${c} = ${r * c}` } }
      : op === 'add'
        ? { corner: '+', rows: range(1, 19), cols: range(1, 19),
            cell: (r, c) => r + c > 20 ? null : { f: { op, x: r, y: c }, text: r + c, title: `${r} + ${c} = ${r + c}` } }
        : { corner: '−', rows: range(1, 20), cols: range(1, 20),
            cell: (r, c) => c > r ? null : { f: { op, x: r, y: c }, text: r - c, title: `${r} − ${c} = ${r - c}` } },
  });
})();

// ---------- menu (burger) ----------
(() => {
  const btn = document.getElementById('menu-btn'), menu = document.getElementById('menu');
  const items = [...menu.querySelectorAll('.menu-item')];
  const open = show => { menu.hidden = !show; btn.setAttribute('aria-expanded', String(show)); };

    document.querySelectorAll('.tabpanel').forEach(p => p.hidden = p.id !== 'tab-' + name);
    items.forEach(i => i.setAttribute('aria-current', String(i.dataset.tab === name)));
    document.getElementById('menu-title').textContent = items.find(i => i.dataset.tab === name).querySelector('b').textContent;
    try { localStorage.setItem('matma.tab', name); } catch (e) {}
  }
  btn.onclick = e => { e.stopPropagation(); open(menu.hidden); };
  items.forEach(i => i.onclick = () => { showTab(i.dataset.tab); open(false); scrollTo(0, 0); });
  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) open(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { open(false); btn.focus(); } }, true);
  let start = 'fiszki';
  try { start = localStorage.getItem('matma.tab') || 'fiszki'; } catch (e) {}
  showTab(start);
})();

<script>
// ---------- W słupku: written addition, subtraction, multiplication and division ----------
(() => {
  const LS = 'matma.slupek.v1';
  const PLACES = ['J', 'D', 'S', 'T', 'DT'];
  const NAMES = ['jedności', 'dziesiątki', 'setki', 'tysiące', 'dziesiątki tysięcy'];
  const SIGN = { add: '+', sub: '−', mul: '×', div: ':' };
  const $ = id => document.getElementById(id);
  const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const rev = n => String(n).split('').reverse().map(Number); // index = place (0 = jedności)
  const cap = t => t[0].toUpperCase() + t.slice(1);

  let st = { op: 'add', digits: 3, solved: 0, clean: 0, streak: 0 };
  try { st = { ...st, ...JSON.parse(localStorage.getItem(LS)) }; } catch (e) {}
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };

  let P = null;       // current problem
  let note = { html: '', cls: '' };
  let badAt = null;   // cell flashing red

  // ---------- problems ----------
  function generate(op, n) {
    const lo = 10 ** (n - 1), hi = 10 ** n - 1;
    for (let tries = 0; ; tries++) {
      let a, b, res;
      if (op === 'add') { a = rnd(lo, hi); b = rnd(lo, hi); res = a + b; }
      if (op === 'sub') { a = rnd(lo + 1, hi); b = rnd(Math.max(1, Math.floor(lo / 2)), a - 1); res = a - b; }
      if (op === 'mul') { a = rnd(lo, hi); b = rnd(2, 9); res = a * b; }
      if (op === 'div') { b = rnd(2, 9); const q = rnd(Math.ceil(lo / b), Math.floor(hi / b)); a = q * b; res = q; }
      // prefer examples that actually need carrying / borrowing
      const A = rev(a), B = rev(b);
      const needs = op === 'add' ? A.some((d, i) => d + (B[i] || 0) >= 10)
        : op === 'sub' ? A.some((d, i) => d < (B[i] || 0)) : true;
      if (needs || tries > 6) return { op, a, b, res };
    }
  }

  function setup(pr) {
    pr.mistakes = 0; pr.wrongHere = 0; pr.done = false; pr.entered = [];
    if (pr.op === 'div') return setupDiv(pr);
    const A = rev(pr.a), B = rev(pr.b), R = rev(pr.res);
    Object.assign(pr, { A, B, R, W: Math.max(A.length, B.length, R.length), cur: A.slice(), crossed: [], over: [], carry: [], active: 0 });
    pr.carryIn = []; let c = 0;
    for (let p = 0; p < pr.W; p++) {
      pr.carryIn[p] = c;
      const s = pr.op === 'add' ? (A[p] || 0) + (B[p] || 0) + c : (A[p] || 0) * pr.b + c;
      c = Math.floor(s / 10);
    }
    return pr;
  }

  function setupDiv(pr) {
    const D = String(pr.a).split('').map(Number), d = pr.b;
    let start = 0, pre = D[0];
    while (pre < d && start < D.length - 1) { start++; pre = pre * 10 + D[start]; }
    const steps = []; let cur = pre;
    for (let i = start; i < D.length; i++) {
      if (i > start) cur = cur * 10 + D[i];
      const q = Math.floor(cur / d), prod = q * d, rem = cur - prod;
      steps.push({ i, cur, q, prod, rem });
      cur = rem;
    }
    return Object.assign(pr, { D, d, steps, k: 0, shown: 0 });
  }

  const needBorrow = () => P.op === 'sub' && !P.done && P.cur[P.active] < (P.B[P.active] || 0);

  function newProblem() {
    P = setup(generate(st.op, st.digits));
    badAt = null;
    prompt();
    render();
  }

  // ---------- messages ----------
  function prompt() {
    if (P.op === 'div') {
      const s = P.steps[P.k];
      note = { html: `Ile razy <b>${P.d}</b> mieści się w <b>${s.cur}</b>?`, cls: '' };
      return;
    }
    const p = P.active, name = NAMES[p];
    if (needBorrow()) {
      note = { html: `${P.cur[p]} to mniej niż ${P.B[p]}, trzeba <b>pożyczyć</b>. Dotknij cyfry obok albo „Pożycz”.`, cls: '' };
    } else if (p >= P.A.length && p >= (P.B.length) && P.op !== 'sub') {
      note = { html: `Przeniesione <b>${P.carryIn[p]}</b> zapisz na dole.`, cls: '' };
    } else {
      note = { html: `Teraz <b>${name}</b>.`, cls: '' };
    }
  }

  function explain() {
    if (P.op === 'div') {
      const s = P.steps[P.k];
      return `${s.q} × ${P.d} = ${s.prod}` + ((s.q + 1) * P.d > s.cur ? `, a ${s.q + 1} × ${P.d} = ${(s.q + 1) * P.d} to już za dużo` : '') + `. Wpisz <b>${s.q}</b>.`;
    }
    const p = P.active, x = P.A[p] || 0, y = P.B[p] || 0, c = P.carryIn[p];
    if (P.op === 'sub') return `${cap(NAMES[p])}: ${P.cur[p]} − ${y} = <b>${P.cur[p] - y}</b>.`;
    if (p >= P.A.length && p >= P.B.length) return `Przeniesione ${c} zapisz na dole: wpisz <b>${c}</b>.`;
    const s = P.op === 'add' ? x + y + c : x * P.b + c;
    const expr = P.op === 'add' ? `${x} + ${y}${c ? ` + ${c}` : ''}` : `${x} × ${P.b}${c ? ` + ${c}` : ''}`;
    return `${cap(NAMES[p])}: ${expr} = ${s}. Wpisz <b>${s % 10}</b>` + (s >= 10 ? `, a <b>${Math.floor(s / 10)}</b> przenieś dalej.` : '.');
  }

  function softHint() {
    if (P.op === 'div') return `Spróbuj jeszcze raz. Ile razy <b>${P.d}</b> mieści się w <b>${P.steps[P.k].cur}</b>?`;
    const p = P.active;
    if (P.op === 'sub' && P.crossed[p]) return `Spróbuj jeszcze raz. Po pożyczeniu masz tu <b>${P.cur[p]}</b>.`;
    if (P.op !== 'sub' && P.carryIn[p]) return `Spróbuj jeszcze raz. Pamiętaj o przeniesionej <b>${P.carryIn[p]}</b> (mała czerwona cyfra).`;
    return 'Spróbuj jeszcze raz.';
  }

  // ---------- actions ----------
  function enter(d) {
    if (!P || P.done) return;
    if (needBorrow()) { note.cls = 'bad'; renderNote(); return; }
    const expected = P.op === 'div' ? P.steps[P.k].q : P.R[P.active];
    if (d === expected) {
      P.wrongHere = 0; badAt = null;
      if (P.op === 'div') {
        P.entered[P.steps[P.k].i] = d; P.k++; P.shown = P.k;
        if (P.k >= P.steps.length) return finish();
      } else {
        const p = P.active;
        P.entered[p] = d;
        if (P.op !== 'sub' && p + 1 < P.W && P.carryIn[p + 1] > 0) P.carry[p + 1] = P.carryIn[p + 1];
        P.active++;
        if (P.active >= P.R.length) return finish();
      }
      prompt();
    } else {
      P.mistakes++; P.wrongHere++;
      badAt = { d };
      note = { html: P.wrongHere >= 2 ? explain() : softHint(), cls: 'bad' };
    }
    render();
  }

  function borrow() {
    if (!needBorrow()) return;
    const p = P.active;
    let j = p + 1;
    while (P.cur[j] === 0) j++;
    P.cur[j]--; P.crossed[j] = true; P.over[j] = P.cur[j];
    for (let k = j - 1; k > p; k--) { P.cur[k] = 9; P.crossed[k] = true; P.over[k] = 9; }
    P.cur[p] += 10; P.crossed[p] = true; P.over[p] = P.cur[p];
    note = { html: `Pożyczone! Teraz <b>${NAMES[p]}</b>: ${P.cur[p]} − ${P.B[p]}.`, cls: '' };
    render();
  }

  function finish() {
    P.done = true; badAt = null;
    st.solved++;
    if (P.mistakes === 0) { st.clean++; st.streak++; } else st.streak = 0;
    save();
    note = { html: `Brawo! ${P.a} ${SIGN[P.op]} ${P.b} = ${P.res}` + (P.mistakes === 0 ? '. Bez ani jednego błędu!' : '.'), cls: 'good' };
    if (P.mistakes === 0 && window.matmaConfetti) window.matmaConfetti(st.streak % 5 === 0 ? 140 : 50);
    render();
  }

  // ---------- rendering ----------
  const cell = (html, cls = '') => `<span class="c ${cls}">${html}</span>`;
  const box = (state, v = '') => `<span class="box ${state}">${v}</span>`;

  function renderCol() {
    const { W, A, B, R } = P, n = W + 1;
    const col = p => W - p;                      // grid column of a place
    const rows = [];
    const row = (cls, fill) => {
      const cells = Array.from({ length: n }, (_, c) => {
        const p = W - c, tint = c > 0 ? `p${p}` + (c > 0 && p === P.active && !P.done ? ' now' : '') : '';
        return fill(c, p, tint);
      });
      rows.push(`<div class="r ${cls}">${cells.join('')}</div>`);
    };
    row('lab', (c, p, t) => cell(c ? PLACES[p] : '', t));
    row('sm', (c, p, t) => cell(c ? (P.op === 'sub' ? (P.crossed[p] ? P.over[p] : '') : (P.carry[p] || '')) : '', t));
    const borrowing = needBorrow();
    row('', (c, p, t) => {
      if (!c || p >= A.length) return cell('', t);
      const tap = borrowing && p === P.active + 1;
      const v = P.op === 'sub' && P.crossed[p] ? `<span class="x">${A[p]}</span>` : A[p];
      return `<span class="c ${t}${tap ? '" data-borrow="1' : ''}"><span class="${tap ? 'tap' : ''}">${v}</span></span>`;
    });
    row('', (c, p, t) => c === 0 ? cell(SIGN[P.op], 'sign') : cell(p < B.length ? B[p] : '', t));
    row('ln', (c, p, t) => cell('', 'on ' + t));
    row('', (c, p, t) => {
      if (!c || p >= R.length) return cell('', t);
      if (P.entered[p] !== undefined) return cell(box('ok', P.entered[p]), t);
      if (p === P.active && !P.done) return cell(badAt ? box('bad', badAt.d) : box('act'), t);
      return cell(box(''), t);
    });
    return { n, html: rows.join('') };
  }

  function renderDiv() {
    const { D, d, steps } = P, L = D.length, n = L + 3;   // sign, digits, ':', divisor
    const tint = c => c >= 1 && c <= L ? `p${L - c}` : '';
    const rows = [];
    const row = (cls, fill) => rows.push(`<div class="r ${cls}">${Array.from({ length: n }, (_, c) => fill(c, tint(c))).join('')}</div>`);
    const active = !P.done && steps[P.k] ? steps[P.k].i : -1;
    row('lab', (c, t) => cell(c >= 1 && c <= L ? PLACES[L - c] : '', t));
    row('', (c, t) => {
      const i = c - 1;
      if (c < 1 || c > L || i < steps[0].i) return cell('', t);
      if (P.entered[i] !== undefined) return cell(box('ok', P.entered[i]), t);
      if (i === active) return cell(badAt ? box('bad', badAt.d) : box('act'), t + ' now');
      return cell(box(''), t);
    });
    row('ln', (c, t) => cell('', (c >= 1 && c <= L ? 'on ' : '') + t));
    row('', (c, t) => c >= 1 && c <= L ? cell(D[c - 1], t) : c === L + 1 ? cell(':', 'sign') : c === L + 2 ? cell(d, 'sign') : cell('', t));
    // finished steps: − product, line, what is left (with the next digit brought down)
    const placeNum = (num, endCol, sign) => {
      const s = String(num), from = endCol - s.length + 1;
      row('', (c, t) => c >= from && c <= endCol ? cell(s[c - from], t) : (sign && c === from - 1 ? cell('−', 'sign') : cell('', t)));
      return from;
    };
    for (let k = 0; k < P.shown; k++) {
      const s = steps[k], end = s.i + 1;
      const from = placeNum(s.prod, end, true);
      row('ln', (c, t) => cell('', (c >= from && c <= end ? 'on ' : '') + t));
      if (s.i + 1 < L) placeNum(s.rem * 10 + D[s.i + 1], end + 1, false);
      else placeNum(s.rem, end, false);
    }
    return { n, html: rows.join('') };
  }

  function renderNote() {
    const el = $('sl-note');
    el.innerHTML = `<span>${note.html}</span>`; el.className = 'sl-note ' + note.cls;
  }

  function render() {
    const { n, html } = P.op === 'div' ? renderDiv() : renderCol();
    const sh = $('sl-sheet');
    sh.style.setProperty('--n', n);
    sh.innerHTML = html;
    renderNote();
    $('sl-solved').textContent = st.solved;
    $('sl-clean').textContent = st.clean;
    $('sl-streak').textContent = st.streak;
    const go = $('sl-go'), aux = $('sl-aux');
    go.textContent = P.done ? 'Dalej →' : '✓';
    go.classList.toggle('word', P.done);
    go.disabled = !P.done;
    const b = needBorrow();
    aux.textContent = b ? 'Pożycz' : 'Pomocy';
    aux.classList.toggle('go', b);
    aux.disabled = P.done;
  }

  function renderSettings() {
    document.querySelectorAll('#sl-op button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.op === st.op)));
    document.querySelectorAll('#sl-digits button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.d === st.digits)));
    $('sl-digits-label').textContent = st.op === 'mul' ? 'Ile cyfr ma mnożna?' : st.op === 'div' ? 'Ile cyfr ma dzielna?' : 'Ile cyfr?';
  }

  // ---------- input ----------
  function help() {
    if (!P || P.done) return;
    if (needBorrow()) return borrow();
    note = { html: explain(), cls: '' };
    P.mistakes++;                // asking for the answer counts as a hint used
    renderNote();
  }

  function buildPad() {
    const pad = $('sl-pad');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'aux', '0', 'go'].forEach(k => {
      const b = document.createElement('button');
      b.className = 'key' + (k === 'go' ? ' go' : k === 'aux' ? ' word' : '');
      if (k === 'aux') { b.id = 'sl-aux'; b.onclick = help; }
      else if (k === 'go') { b.id = 'sl-go'; b.onclick = () => P.done && newProblem(); }
      else { b.textContent = k; b.onclick = () => enter(+k); }
      pad.append(b);
    });
  }

  $('sl-sheet').addEventListener('click', e => { if (e.target.closest('[data-borrow]')) borrow(); });
  document.querySelectorAll('#sl-op button').forEach(b => b.onclick = () => { st.op = b.dataset.op; save(); renderSettings(); newProblem(); });
  document.querySelectorAll('#sl-digits button').forEach(b => b.onclick = () => { st.digits = +b.dataset.d; save(); renderSettings(); newProblem(); });
  $('sl-new').onclick = newProblem;

  document.addEventListener('keydown', e => {
    if ($('tab-slupek').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); enter(+e.key); }
    else if (e.key === 'Enter') { e.preventDefault(); if (P.done) newProblem(); else if (needBorrow()) borrow(); }
  });

  buildPad();
  renderSettings();
  newProblem();
})();
</script>
</body>
</html>
